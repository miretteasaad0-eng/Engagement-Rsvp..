<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mariam & Kirollos - Engagement</title>
    <style>
        body { font-family: 'Montserrat', sans-serif; background: #faf6f0; padding: 20px; display: flex; justify-content: center; }
        .container { max-width: 480px; background: #fff; padding: 30px; border-radius: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); text-align: center; }
        input, select, button { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ccc; border-radius: 8px; box-sizing: border-box; }
        button { background: #c5a059; color: white; border: none; cursor: pointer; font-weight: bold; }
        button:hover { background: #b08d46; }
    </style>
</head>
<body>

    <div class="container">
        <h1>RSVP</h1>
        <p>Please confirm your attendance</p>
        
        <form action="https://formsubmit.co/Miretteassad0@gmail.com" method="POST">
            <input type="hidden" name="_captcha" value="false">
            <input type="hidden" name="_subject" value="New RSVP Response!">

            <input type="text" name="Name" placeholder="Full Name" required>
            
            <select name="Attendance">
                <option value="Joyfully Yes">Joyfully Yes</option>
                <option value="Sadly No">Sadly No</option>
            </select>
            
            <input type="number" name="Guests" placeholder="Number of Guests" min="0">
            
            <button type="submit">Send My Answer</button>
        </form>
    </div>

</body>
</html>
